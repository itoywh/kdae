# NOTE: This build.yml is SELF-CONTAINED and intentionally does NOT depend on
# daeuniverse/ci-seed-jobs (pre-actions / post-actions). It calls the local
# seed-build.yml directly. Keep it that way so the workflow runs without the
# external ci-seed-jobs repo.

name: Build (Main)

on:
  push:
    branches:
      - main
      - kdae
    paths:
      - "**/*.go"
      - "**/*.c"
      - "**/*.h"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
      - ".github/workflows/seed-build.yml"
      - "Makefile"

jobs:
  build:
    uses: ./.github/workflows/seed-build.yml
    with:
      ref: ${{ github.sha }}
      build-type: main-build
    secrets: inherit
