# kdae-notify-b.yml — 冗余触发：与 kdae-notify.yml 逻辑相同，cron 错开 3 分钟
# 目的: GitHub 对 fork 的 schedule 触发不可靠(可能长时间 drop)，双 workflow 任一个触发即可完成通知
# 去重: 共用 last-notified.json（仓库 kdae 分支），谁先触发谁发通知，另一个自动 skip，不重复
# 认证: 优先 secrets.KDAE_MIRROR_PAT；未配置时回退 secrets.GITHUB_TOKEN
name: kdae-notify-b

on:
  schedule:
    - cron: '8,23,38,53 * * * *'   # 每 15 分钟, 与主 workflow 错开 3 分钟
  push:
    branches: [kdae]               # 仓库有活动时顺带检查（多一路触发）
  workflow_dispatch:               # 支持手动触发

permissions:
  contents: write

concurrency:
  group: kdae-notify-b
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.KDAE_MIRROR_PAT }}
      UPSTREAM: olicesx/dae
      MIRROR: itoywh/kdae
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kdae

      - name: 选 token (PAT 优先, 回退 GITHUB_TOKEN)
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          fi

      - name: 取 kdae 分支 head commit (单一事实源, 免疫 runs 列表乱序)
        id: head
        run: |
          sha=$(gh api "repos/$UPSTREAM/branches/kdae" --jq .commit.sha)
          echo "sha=$sha" >> $GITHUB_OUTPUT
          echo "head commit: $sha"

      - name: CI 全绿判定 (head_sha 反查该 commit 全部 runs)
        # 与 dae-web CI 门禁同口径 (2026-09-05):
        #   GREEN   = 该 commit 全部 run completed 且 success, 且 Build (Main) 成功
        #   PENDING = 有 run 排队/运行中;  RED = 有 failure/cancelled/timed_out
        #   NOBUILD = 无成功的 Build (Main) (无产物可更)
        # 不回溯: head 未全绿时保持沉默, 绝不把旧的成功 commit 当"新版本"报告
        id: ci
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          json=$(gh api "repos/$UPSTREAM/actions/runs?branch=kdae&head_sha=$HEAD_SHA&per_page=50")
          verdict=$(echo "$json" | jq -r '
            (.workflow_runs // []) as $r
            | if ($r | length) == 0 then "NOBUILD"
              elif any($r[]; .status != "completed") then "PENDING"
              elif any($r[]; .conclusion != "success") then "RED"
              elif any($r[]; .name == "Build (Main)" and .conclusion == "success") then "GREEN"
              else "NOBUILD" end')
          run_id=$(echo "$json" | jq -r '[.workflow_runs[] | select(.name=="Build (Main)" and .conclusion=="success")][0].id // empty')
          echo "verdict=$verdict" >> $GITHUB_OUTPUT
          echo "run_id=$run_id" >> $GITHUB_OUTPUT
          echo "CI 判定: $verdict (build_run_id=$run_id)"

      - name: 检查是否有新版本 (仅全绿通知, last-notified.json 去重)
        id: check
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          VERDICT: ${{ steps.ci.outputs.verdict }}
        run: |
          last=$(jq -r .source_sha last-notified.json 2>/dev/null || true)
          if [ "$VERDICT" != "GREEN" ]; then
            echo "head $HEAD_SHA CI 判定=$VERDICT, 未全绿不通知 (不回溯旧 commit)"
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [ "$last" = "$HEAD_SHA" ]; then
            echo "无新版本 (已通知 $HEAD_SHA), 跳过"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "有新版本(全绿): ${last:-none} -> $HEAD_SHA"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Server 酱通知 + 记录 last-notified.json
        if: steps.check.outputs.skip != 'true'
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          sha=$HEAD_SHA
          cm=$(gh api "repos/$UPSTREAM/commits/$sha" --jq '.commit.message' | sed 's/\r$//')
          title="kdae 上游新版本: ${sha:0:8} (CI 全绿)"
          desp=$(cat <<EOF
          上游: olicesx/dae@${sha:0:12}
          CI 判定: GREEN (head commit 全部 workflow 通过, 可安全更新)
          Commit: https://github.com/$UPSTREAM/commit/$sha
          CI Run: https://github.com/$UPSTREAM/actions/runs/$RUN_ID
          检测时间: $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          ### Commit: ${sha:0:12}
          ${cm}
          EOF
          )
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
            --data-urlencode "title=${title}" \
            --data-urlencode "desp=${desp}")
          echo "Server酱推送 HTTP $code"
          [ "$code" = "200" ] || exit 1
          cat > last-notified.json <<EOF
          {
            "source_repo": "$UPSTREAM",
            "source_branch": "kdae",
            "source_sha": "$sha",
            "ci_verdict": "GREEN",
            "run_id": $RUN_ID,
            "notified_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          git config user.name "kdae-notify[bot]"
          git config user.email "kdae-notify[bot]@users.noreply.github.com"
          git add last-notified.json
          git commit -m "notify kdae ${sha:0:12}"
          git push || { git pull --rebase && git push; }

      - name: 异常告警（前面步骤失败时推送）
        if: failure()
        run: |
          curl -sS -o /dev/null -w '%{http_code}\n' \
            -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
            --data-urlencode "title=kdae-notify-b 异常 (${{ github.event_name }})" \
            --data-urlencode "desp=workflow 执行失败，请检查:\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
