# touch 20260825T1735: force workflow re-index
# sync-kdae.yml — 定时从 olicesx/dae(kdae分支) CI artifact 镜像到本仓库 Release
# 认证: 优先 secrets.KDAE_MIRROR_PAT(推荐, fine-grained token, 仅 Actions:read + public_repo);
#       未配置时回退 secrets.GITHUB_TOKEN(跨仓库下载可能 401, 建议配 PAT)
name: sync-kdae

on:
  schedule:
    - cron: '23,53 * * * *'   # 每 30 分钟第 23/53 分钟, 错开上游 CI 高峰
  workflow_dispatch:         # 支持手动触发

permissions:
  contents: write
  actions: read

concurrency:
  group: sync-kdae
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.KDAE_MIRROR_PAT }}
      UPSTREAM: olicesx/dae
      MIRROR: itoywh/kdae
    steps:
      - uses: actions/checkout@v4

      - name: 选 token (PAT 优先, 回退 GITHUB_TOKEN)
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          fi

      - name: 定位 kdae 分支最新成功 Build (Main) run
        id: run
        run: |
          run_id=$(gh api "repos/$UPSTREAM/actions/runs?branch=kdae&per_page=30" \
            --jq '.workflow_runs[] | select(.name=="Build (Main)" and .conclusion=="success") | .id' | head -1)
          if [ -z "$run_id" ]; then echo "未找到成功 Build (Main) run"; exit 1; fi
          echo "run_id=$run_id" >> $GITHUB_OUTPUT
          echo "最新 run: $run_id"

      - name: 检查是否有新构建 (no-op 短路)
        id: check
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          sha=$(gh api "repos/$UPSTREAM/actions/runs/$RUN_ID" --jq .head_sha)
          echo "sha=$sha" >> $GITHUB_OUTPUT
          cur=$(curl -sS "https://raw.githubusercontent.com/$MIRROR/kdae/latest.json" | jq -r .source_sha)
          if [ "$cur" = "$sha" ]; then
            echo "无新构建 (latest=$cur), 跳过同步"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "有新构建: $cur -> $sha"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 下载并校验架构产物
        id: dl
        if: steps.check.outputs.skip != 'true'
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          mkdir -p dist
          for art in dae-linux-x86_64_v2_sse.zip dae-linux-x86_64.zip dae-linux-x86_64_v3_avx2.zip dae-linux-arm64.zip; do
            meta=$(gh api "repos/$UPSTREAM/actions/runs/$RUN_ID/artifacts" \
              --jq ".artifacts[] | select(.name==\"$art\" and .expired==false) | {id, digest}" | head -1)
            if [ -z "$meta" ]; then echo "跳过(不存在或已过期): $art"; continue; fi
            art_id=$(echo "$meta" | jq -r .id)
            digest=$(echo "$meta" | jq -r .digest | sed 's/^sha256://')
            echo "下载 $art (id=$art_id)"
            gh api "repos/$UPSTREAM/actions/artifacts/$art_id/zip" > "dist/$art"
            echo "$digest  dist/$art" | sha256sum -c - || { echo "校验失败: $art"; exit 1; }
            echo "$art $digest" >> dist/sha256.list
          done
          ls -lh dist/

      - name: "发布 Release (幂等: 同 commit 已存在则跳过)"
        id: release
        if: steps.check.outputs.skip != 'true'
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          sha=$(gh api "repos/$UPSTREAM/actions/runs/$RUN_ID" --jq .head_sha)
          tag="kdae-${sha:0:8}-$(date +%Y%m%d)"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          if gh release view "$tag" --repo "$MIRROR" >/dev/null 2>&1; then
            echo "Release $tag 已存在, 跳过发布"
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          gh release create "$tag" dist/*.zip \
            --repo "$MIRROR" \
            --title "kdae mirror ${sha:0:8}" \
            --notes "来源: olicesx/dae@${sha:0:12} (run $RUN_ID)"
          echo "已发布: $tag"
          echo "published=true" >> $GITHUB_OUTPUT

      - name: 生成并推送 latest.json
        if: steps.check.outputs.skip != 'true'
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          sha=$(gh api "repos/$UPSTREAM/actions/runs/$RUN_ID" --jq .head_sha)
          tag="${TAG:-$(gh release list --repo "$MIRROR" --limit 1 --json tagName --jq '.[0].tagName')}"
          python3 - "$sha" "$tag" "$RUN_ID" <<'EOF'
          import json, sys, os, datetime
          sha, tag, run_id = sys.argv[1], sys.argv[2], sys.argv[3]
          artifacts = {}
          if os.path.exists("dist/sha256.list"):
              with open("dist/sha256.list") as f:
                  for line in f:
                      name, h = line.split()
                      p = os.path.join("dist", name)
                      artifacts[name] = {"size": os.path.getsize(p), "sha256": h}
          meta = {
              "source_repo": "olicesx/dae",
              "source_branch": "kdae",
              "source_sha": sha,
              "source_sha_short": sha[:12],
              "run_id": int(run_id),
              "release_tag": tag,
              "updated_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "artifacts": artifacts,
          }
          with open("latest.json", "w") as f:
              json.dump(meta, f, indent=2)
              f.write("\n")
          EOF
          git config user.name "sync-kdae[bot]"
          git config user.email "sync-kdae[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            echo "latest.json 无变更"
          else
            git commit -m "update latest.json ($tag)"
            git push
          fi

      - name: Server 酱通知 (仅新版本发布时)
        if: steps.check.outputs.skip != 'true' && steps.release.outputs.published == 'true'
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          sha=$(gh api "repos/$UPSTREAM/actions/runs/$RUN_ID" --jq .head_sha)
          tag="${TAG}"
          title="kdae 新版本已镜像: ${sha:0:8}"
          desp=$(cat <<EOF
          上游: olicesx/dae@${sha:0:12} (run $RUN_ID)
          Release: https://github.com/$MIRROR/releases/tag/$tag
          镜像时间: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          EOF
          )
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
            --data-urlencode "title=${title}" \
            --data-urlencode "desp=${desp}")
          echo "Server酱推送 HTTP $code"
          [ "$code" = "200" ] || exit 1

      - name: 清理旧 Release (仅保留最近 5 个)
        run: |
          gh release list --repo "$MIRROR" --limit 100 --json tagName --jq '.[].tagName' \
            | tail -n +6 | while read t; do
                echo "删除旧 release: $t"
                gh release delete "$t" --repo "$MIRROR" --yes --cleanup-tag
              done
